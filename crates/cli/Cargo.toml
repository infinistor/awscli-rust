[package]
name = "awscli-rest-cli"
description = "awscli-rest 실행 파일: 옵션 파서와 명령 디스패치 (TESTCore Program.cs, Cli/*, Commands/*)"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[lib]
path = "src/lib.rs"

[[bin]]
name = "awscli-rest"
path = "src/main.rs"

[[test]]
name = "parity_version"
path = "../../tests/parity/version.rs"

[[test]]
name = "parity_cli_parse"
path = "../../tests/parity/cli_parse.rs"

[[test]]
name = "parity_cli_help"
path = "../../tests/parity/cli_help.rs"

[[test]]
name = "parity_cli_run"
path = "../../tests/parity/cli_run.rs"

[dependencies]
awscli-rest-clients.workspace = true
awscli-rest-common.workspace = true
awscli-rest-config.workspace = true
awscli-rest-model.workspace = true
awscli-rest-s3.workspace = true
aws-sdk-s3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
encoding_rs.workspace = true
hex.workspace = true
md-5.workspace = true
quick-xml.workspace = true
regex.workspace = true
tempfile.workspace = true
