# 각 서버의 name을 Controller의 driver 설정과 일치시킵니다.
[worker]
name = driver1
# 같은 서버의 Worker마다 포트를 구분하고, Controller의 해당 driver url과 일치시킵니다.
url = http://0.0.0.0:18088/driver
# 상대 경로는 INI 위치 기준입니다. Prepare와 GET의 ETag 검사가 원본 파일을 재사용합니다.
WorkPath = ./worker-data
# 같은 서버의 여러 Worker는 결과 경로를 분리해야 합니다. 예: ./worker-results/driver1
ResultPath = ./worker-results
# Controller가 요청할 수 있는 lease 상한(초)입니다. heartbeat가 요청한 기간 동안 없으면 중단합니다.
LeaseTimeoutSeconds = 15
# 버킷 이름 뒤에 그대로 붙입니다. 생략하거나 비워 두면 적용하지 않습니다.
# 예: -user1이면 test-bucket → test-bucket-user1
BucketSuffix =

# 이 Worker만 다른 S3 사용자로 실행하려면 아래 섹션을 활성화합니다.
# URL/AccessKey/SecretKey를 모두 설정해야 합니다. RegionName은 선택 사항입니다.
# 섹션이 없으면 Controller가 전달한 접속 정보를 사용합니다.
# [Main User]
# URL = http://127.0.0.1:9000
# RegionName =
# AccessKey = replace-with-worker-access-key
# SecretKey = replace-with-worker-secret-key
