# 기존 CLI 옵션으로 아래 테스트 설정을 덮어쓸 수 있습니다.
[Default]
BucketName = testcore-benchmark
ThreadPrefix = TH
ObjectPrefix = FILE
FileSize = 1M
Retry = 2

[UpDown]
# Worker 한 개당 스레드 수입니다. 전체 부하는 ThreadCount × 활성 driver 수입니다.
ThreadCount = 10
FileCount = 100
Times = 60
BucketType = 4
DivisionCount = 1000
ReadRatio = 7
WriteRatio = 3
ETagCheck = false
UseChunkEncoding = false

[Main User]
# 로컬 [Main User] 설정이 없는 Worker에 전달할 기본 접속 정보입니다.
URL = http://127.0.0.1:9000
RegionName =
AccessKey = replace-me
SecretKey = replace-me

[controller]
# [driver1]부터 지정 개수까지 사용합니다. 아래 driver13~18 예시는 현재 비활성입니다.
drivers = 12
# 상대 경로는 이 INI 파일의 디렉터리 기준입니다.
# Linux 예: ResultPath = /var/log/test/
ResultPath = ./results
# 모든 Worker가 Ready가 될 때까지 기다릴 최대 시간(초)입니다.
PrepareTimeoutSeconds = 180
# 전체 준비 후 시작까지의 여유 시간(초)입니다. Worker 서버 간 시계 동기화가 필요합니다.
StartDelaySeconds = 5
# 개별 HTTP 요청 제한 시간과 통계/heartbeat 수집 간격(초)입니다.
RequestTimeoutSeconds = 5
PollIntervalSeconds = 2
# PollIntervalSeconds + RequestTimeoutSeconds보다 크고, 각 Worker의 lease 상한 이하여야 합니다.
LeaseTimeoutSeconds = 15

[driver1]
# name은 해당 Worker 설정과 같아야 하고, url은 Controller에서 접속 가능한 주소여야 합니다.
name = driver1
url = http://192.168.31.151:18011/driver

